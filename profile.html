<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Player Profile · Gridiron 151</title><link rel="stylesheet" href="/draft.css"><link rel="stylesheet" href="/league.css"><style>
.profile-shell{max-width:1040px;margin:0 auto;padding:22px 18px 70px}.profile-nav{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:15px;margin-bottom:30px}.profile-nav b{font-size:20px}.profile-nav nav{display:flex;flex-wrap:wrap;gap:15px}.profile-nav a{color:#d6fa79;text-decoration:none;font-size:13px;font-weight:800}
.profile-hero{padding:clamp(24px,5vw,44px);border:1px solid #658470;border-radius:22px;background:linear-gradient(120deg,#264c41,#132d34);margin-bottom:22px}.profile-heading{display:flex;align-items:center;gap:20px;flex-wrap:wrap}.profile-avatar{display:grid;place-items:center;width:84px;height:84px;border-radius:23px;background:#d6fa79;color:#183e2a;font-size:42px;font-weight:900}.profile-eyebrow{color:#c8ef82;font-size:11px;letter-spacing:2px;font-weight:900}.profile-hero h1{margin:7px 0;font-size:clamp(27px,5vw,45px);overflow-wrap:anywhere}.profile-hero p{color:#c2d6cc;margin:0}.profile-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}.profile-actions a{display:inline-block;padding:12px 17px;border-radius:10px;background:#d6fa79;color:#1b3929;text-decoration:none;font-weight:900;font-size:13px}.profile-actions a.secondary{background:#ffffff14;color:#ecfbe7;border:1px solid #658470}
.profile-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:22px}.profile-stat{padding:22px 16px;border:1px solid #567469;border-radius:15px;background:#1b3537}.profile-stat span{display:block;color:#b4d2c5;font-size:11px;font-weight:800;letter-spacing:1px}.profile-stat strong{display:block;font-size:34px;margin-top:8px;color:#d6fa79}
.profile-panel{padding:26px;border:1px solid #567469;border-radius:17px;background:#183034}.profile-panel h2{margin:0 0 16px}.profile-panel a{color:#d6fa79}.match-item{padding:14px 0;border-top:1px solid #ffffff1a}.match-item a{text-decoration:none;font-weight:700}.profile-status{margin:14px 0;color:#c8decf}
@media(max-width:650px){.profile-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.profile-heading{gap:13px}.profile-avatar{width:65px;height:65px;font-size:32px}.profile-nav{align-items:flex-start}.profile-panel{padding:18px}}
</style></head><body><main class="profile-shell"><header class="profile-nav"><b>⚡ GRIDIRON <span style="color:#d6fa79">151</span></b><nav><a href="/">Home</a><a href="/league.html">League</a><a href="/friends.html">Friends</a><a href="/inbox.html">Inbox</a><a href="/builder.html">Builder</a></nav></header><section class="profile-hero"><div class="profile-heading"><div class="profile-avatar" id="avatar">👤</div><div><span class="profile-eyebrow">PLAYER PROFILE</span><h1 id="player">Loading player…</h1><p id="team">Checking Dream Team…</p></div></div><p class="profile-status" id="status" role="status" aria-live="polite">Loading profile…</p><div class="profile-actions"><a href="/my-team.html" id="teamAction">🏈 My Dream Team</a><a href="/inbox.html">📨 Challenges</a><a href="/account.html" class="secondary" id="accountAction">Switch Account</a></div></section><section class="profile-grid" aria-label="League record"><div class="profile-stat"><span>WINS</span><strong id="wins">—</strong></div><div class="profile-stat"><span>LOSSES</span><strong id="losses">—</strong></div><div class="profile-stat"><span>LEAGUE POINTS</span><strong id="points">—</strong></div><div class="profile-stat"><span>RANK</span><strong id="rank">—</strong></div></section><section class="profile-panel"><h2>🏆 Recent League Matches</h2><div id="matches"><p>Loading match history…</p></div></section></main><script src="/profile.js"></script></body></html>

name: Test Pokémon Gridiron
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check server.js
      - run: node --check draft.js
      - run: node tests/simulation.test.js
